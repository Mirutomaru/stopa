[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopa"
version = "2.3.0"
description = "STOPA — unifikovaná forenzní workbench (AXIOM + UFED/Inseyets + X-Ways + Belkasoft X + FTK v jednom)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "regipy>=6",  # Windows registry hive parser (FÁZE 4b)
    "rich>=13",  # R0.4 — progress bary v CLI (lazy import + TTY detekce; bez TTY se degraduje na plain text)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
pdf = ["weasyprint>=62"]  # FÁZE 7 — PDF reporty (volitelné; HTML vždy funguje)
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-multipart>=0.0.9"]  # web GUI — FastAPI nad analyze() + E11 LM Studio klient (+ multipart pro Plaso import upload)
fde = ["cryptography>=42"]  # FÁZE 6b — AES-256-CBC dešifrování mobilních FDE obrazů
tsk = ["pytsk3>=20260715"]  # A2 — nativní TSK bindingy (primární backend; fallback na CLI binárky)
stix = ["stix2>=3"]  # F6.2 — STIX 2.1 validace stix2-validator (lazy import; bez něj graceful degradation)
rules = ["yara-python>=2.8"]  # P3-5 — YARA matching nad soubory (lazy import; bez balíku explicitní status, ne tichý skip)
xlsx = ["openpyxl>=3.1"]  # iMessage cloud — XLSX varianta iCloud Messages exportu (warrant return)
meta = ["Pillow>=10"]  # E8 — EXIF metadata (volitelné; PDF/OOXML/ID3/MP4 fungují bez něj)
net = ["scapy>=2.5"]  # F1.3 — síťová forenzika: PCAP parser + TCP reassembly + IoC (lazy import; bez scapy fallback na statický scanner)
analytics = ["duckdb>=1.0"]  # F2.2 — DuckDB OLAP vrstva pro timeline & analytics (lazy import; bez duckdb SQLite fallback)

[project.scripts]
stopa = "stopa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# R0.2 — web GUI (static SPA) musí být v wheelu, jinak po instalaci z balíčku
# chybí static files a `stopa serve` servíruje prázdné UI.
[tool.setuptools.package-data]
"stopa.web" = ["static/**/*"]
"stopa.i18n" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

# tsk_py.py obaluje C-extension (pytsk3) — blind Exception + pass jsou zde idiomem
# (bindingy házejí OSError/Exception bez stabilní hierarchie; walk musí být robustní).
[tool.ruff.lint.per-file-ignores]
"src/stopa/data/tsk_py.py" = ["BLE001", "S110"]
# test_tsk_py.py — dostupnostní probe (py_available / tsk_bin_dir) chytá široce,
# protože ověřuje „je backend vůbec dostupný“ bez předpokladu konkrétní výjimky.
"tests/test_tsk_py.py" = ["BLE001", "S110"]
# web/app.py + routery — FastAPI Query()/File() v argument defaults je standardní idiom (B008);
# BLE001 = defenzivní catch ve vláknech pozadí (ingest), kde by širší hierarchie rozbila robustnost.
"src/stopa/web/app.py" = ["B008", "BLE001"]
"src/stopa/web/routers/*.py" = ["B008", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
