[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopa"
version = "0.1.0"
description = "STOPA — unifikovaná forenzní workbench (AXIOM + UFED/Inseyets + X-Ways + Belkasoft X + FTK v jednom)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "regipy>=6",  # Windows registry hive parser (FÁZE 4b)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
pdf = ["weasyprint>=62"]  # FÁZE 7 — PDF reporty (volitelné; HTML vždy funguje)
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]  # web GUI — FastAPI nad analyze()
fde = ["cryptography>=42"]  # FÁZE 6b — AES-256-CBC dešifrování mobilních FDE obrazů
tsk = ["pytsk3>=20260715"]  # A2 — nativní TSK bindingy (primární backend; fallback na CLI binárky)
xlsx = ["openpyxl>=3.1"]  # iMessage cloud — XLSX varianta iCloud Messages exportu (warrant return)

[project.scripts]
stopa = "stopa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# tsk_py.py obaluje C-extension (pytsk3) — blind Exception + pass jsou zde idiomem
# (bindingy házejí OSError/Exception bez stabilní hierarchie; walk musí být robustní).
[tool.ruff.lint.per-file-ignores]
"src/stopa/data/tsk_py.py" = ["BLE001", "S110"]
# test_tsk_py.py — dostupnostní probe (py_available / tsk_bin_dir) chytá široce,
# protože ověřuje „je backend vůbec dostupný“ bez předpokladu konkrétní výjimky.
"tests/test_tsk_py.py" = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
