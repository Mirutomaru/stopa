# R0.2 — Release pipeline: generuje distributivní artifacts při push tagu v*.
# Jobs běží paralelně; každý uploadne vlastní artifact do GitHub Actions.
# AK krytí: .deb, .rpm, AppImage, Docker image (< 1.5 GB) + wheel/sdist.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PY_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # .deb + .rpm + sdist/wheel — fpm (ruby gem) builduje oba RPM/DEB z jednoho
  # stromu; python-build dodává wheel+sdist pro pip instalaci.
  # ---------------------------------------------------------------------------
  packages:
    name: Packages (.deb/.rpm/sdist/wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verze z tagu
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # sdist + wheel (pip install stopa==X)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/
          mkdir -p dist/wheels
          cp dist/*.whl dist/wheels/

      # Offline instalační wheels (cp310–cp313 + py3-none-any) — postinst je
      # postaví venv na cílovém systému bez sítě, žádné cross-verze .so.
      - name: Stáhnout instalační wheels
        run: |
          python -m pip download --only-binary=:all: -d dist/wheels "pydantic>=2.5" regipy rich
          python -m pip download --only-binary=:all: -d dist/wheels "fastapi>=0.115" "uvicorn[standard]>=0.30" "httpx>=0.27" "python-multipart>=0.0.9" python-dotenv websockets pyyaml
          python -m pip download --only-binary=:all: -d dist/wheels cryptography openpyxl Pillow
          for pv in 310 311 312 313; do
            # Release 2.4 CI fix: $$ v YAML block skalaru = PID v bashi (2310{pv...});
            # GHA expanduje jen výrazy s {{ }} → pro bash stačí jedno $.
            python -m pip download --only-binary=:all: --python-version ${pv:0:1}.${pv:1} -d dist/wheels pydantic-core pillow httptools uvloop websockets pyyaml cffi || true
          done

      # fpm → .deb a .rpm z wheel stromu + postinst (stejný layout jako make deb)
      - name: Instalovat fpm (ruby gem)
        run: |
          sudo apt-get update && sudo apt-get install -y ruby
          # Release 2.4 CI fix vlna 3: non-root `gem install` jde do user diru
          # (~/.local/share/gem/...), který se do PATH nedostane — `gem env home`
          # a `gem environment bindir` hlásí systémový dir, binář tam ale není.
          # sudo gem → Debian/Ubuntu system bindir = /usr/local/bin (už v PATH);
          # fpm se ověří hned, aby případná absence končila zde, ne až v build kroku.
          sudo gem install --no-document fpm
          hash -r || true
          fpm --version

      - name: Sestavit instalační strom (wheels)
        id: tree
        run: |
          mkdir -p dist/pkg/usr/lib/stopa/wheels
          cp dist/wheels/*.whl dist/pkg/usr/lib/stopa/wheels/
          echo "tree_ready=1" >> "$GITHUB_OUTPUT"

      - name: Build .deb (fpm + postinst venv)
        run: |
          fpm -s dir -t deb \
            --name stopa --version ${{ steps.ver.outputs.tag }} \
            --architecture amd64 \
            --depends python3 --depends python3-venv --depends sleuthkit \
            --after-install packaging/postinst.sh \
            --description "STOPA — unifikovaná forenzní workbench" \
            dist/pkg=/ --force \
            -p dist/stopa_${{ steps.ver.outputs.tag }}_amd64.deb

      - name: Build .rpm (fpm + postinst venv)
        run: |
          fpm -s dir -t rpm \
            --name stopa --version ${{ steps.ver.outputs.tag }} \
            --architecture x86_64 \
            --depends python3 --depends sleuthkit \
            --after-install packaging/postinst.sh \
            --description "STOPA — unifikovaná forenzní workbench" \
            dist/pkg=/ --force \
            -p dist/stopa-${{ steps.ver.outputs.tag }}-x86_64.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stopa-packages-${{ steps.ver.outputs.tag }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # P4-10 — Rust core wheels (manylinux_2_28), matrix per arch:
  # x86_64 nativně, aarch64 cross-compilace přes maturin --zig (bez ARM runneru).
  # Výstup = release assety, které pinuje extra `carving` v pyproject.toml
  # (pip install stopa[carving] → stopa_core wheel; bez něj čisté-Python fallback).
  # cp310-abi3 wheel = jeden per platforma pro všechny Python >= 3.10.
  # ---------------------------------------------------------------------------
  rust-wheels:
    name: Rust wheels (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      # rustup v kontejneru; aarch64 target pro cross build (zig dodává libc, QEMU zbytečný)
      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      # Release 2.4 CI fix: layout manylinux image se liší verzí (cpXXX-x64 → cpXXX-cpXXX /
      # symlinky) → robustní detekce CPython místo hardcoded cesty.
      - name: Detect CPython in manylinux image
        id: py
        run: |
          for cand in /opt/python/cp311* /usr/local/bin/python3.11 /usr/local/bin/python3; do
            for p in $cand/bin/python $cand; do
              if [ -x "$p" ]; then echo "py=$p" >> "$GITHUB_OUTPUT"; exit 0; fi
            done
          done
          echo "::error::CPython nenalezen v manylinux image (/opt/python, /usr/local/bin)" >&2
          exit 1

      - name: Build wheel (${{ matrix.arch }})
        run: |
          PY=${{ steps.py.outputs.py }}
          $PY -m pip install --upgrade pip
          $PY -m pip install maturin
          cd rust
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # nativní build v manylinux kontejneru, auto auditwheel repair na tag
            $PY -m maturin build --release \
              --compatibility manylinux_2_28 -o ../dist-rust/
          else
            # cross: zig dodává aarch64 libc → bez QEMU / ARM runneru
            rustup target add aarch64-unknown-linux-gnu
            $PY -m pip install "maturin[zig]"
            # Release 2.4 CI fix: wheel `ziglang` balí binář pod site-packages/ziglang/ —
            # maturin --zig ho hledá v PATH, bez doplnění končí "Failed to find zig".
            ZIGDIR=$($PY -c "import site; print(site.getsitepackages()[0] + '/ziglang')")
            export PATH="$ZIGDIR:$PATH"
            "$ZIGDIR/zig" version
            $PY -m maturin build --release \
              --compatibility manylinux_2_28 --zig \
              --target aarch64-unknown-linux-gnu -o ../dist-rust/
          fi

      - name: Verify wheel tag (manylinux_2_28_${{ matrix.arch }})
        run: |
          ls dist-rust/
          # přesný očekávaný tag — chrání proti tichému degradaci na linux_*
          ${{ steps.py.outputs.py }} -c "
          import glob, sys
          arch = '${{ matrix.arch }}'
          suffix = f'cp310-abi3-manylinux_2_28_{arch}.whl'
          wheels = [w for w in glob.glob('dist-rust/*.whl') if w.endswith(suffix)]
          if not wheels:
              print(f'::error::Chybí wheel s tagem {suffix}')
              sys.exit(1)
          print('OK:', wheels[0])
          "

      - name: Upload Rust wheels (release assets)
        uses: actions/upload-artifact@v4
        with:
          name: rust-wheels-${{ matrix.arch }}
          path: dist-rust/*.whl

  # ---------------------------------------------------------------------------
  # P4-10 — publikace Rust wheelů jako assety GitHub Release. Actions artifact
  # nestačí: extra `carving` v pyproject.toml pinuje přímé download URL z tohoto
  # tagu (v2.4.0), takže bez release assetu `pip install stopa[carving]` = 404.
  # softprops/action-gh-release na pushi v* tagu nájde/aktualizuje release podle
  # GITHUB_REF_NAME a nahraje wheels jako assets (idempotentní při re-run).
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish release (wheels → GitHub Release)
    needs: [rust-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-wheels-x86_64
          path: dist-rust/

      - uses: actions/download-artifact@v4
        with:
          name: rust-wheels-aarch64
          path: dist-rust/

      - name: Upload wheels as release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-rust/*.whl


  # ---------------------------------------------------------------------------
  # AppImage — PyInstaller onedir + AppImageTool. continue-on-error: download
  # runtime z appimage.org je externí závislost; selhání nesmí blokovat
  # deb/rpm/docker artifacts (AK primary = instalovatelný balík).
  # ---------------------------------------------------------------------------
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip

      - name: Build onedir (PyInstaller)
        run: |
          python -m pip install --upgrade pip pyinstaller ".[web]"
          pyinstaller \
            --name stopa --onedir --noconfirm \
            --collect-all stopa \
            src/stopa/__main__.py || true
          # PyInstaller spec fallback: vstup jako modul.
          test -d dist/stopa || { mkdir -p dist/stopa; cp -r build/* dist/stopa/ 2>/dev/null || true; }

      - name: Stáhnout AppImage runtime (AppRun)
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            && chmod +x appimagetool-x86_64.AppImage

      - name: Sestavit AppImage
        run: |
          mkdir -p AppDir
          cp -r dist/stopa/* AppDir/ 2>/dev/null || true
          cat > AppDir/AppRun <<'EOF'
            #!/bin/sh
            exec "$(dirname "$0")/bin/python" -m stopa.cli "$@"
          EOF
          chmod +x AppDir/AppRun
          # novější appimagetool validuje [Desktop Entry] skupinu (freedesktop spec);
          # Release 2.4 CI fix: desktop-file-validate dále vyžaduje Categories=
          printf '[Desktop Entry]\nName=STOPA\nComment=Forenzní workbench\nType=Application\nIcon=stopa\nExec=stopa\nCategories=Utility;Forensics;\n' > AppDir/stopa.desktop
          ./appimagetool-x86_64.AppImage AppDir stopa.AppImage

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stopa-appimage
          path: stopa.AppImage
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Docker — buildx multi-stage (Dockerfile) → tar image; AK < 1.5 GB ověřeno.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image (< 1.5 GB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (buildx → tar)
        run: |
          docker buildx create --use --name stopa-builder || true
          docker buildx build \
            --tag stopa:${GITHUB_REF_NAME#v} \
            --output type=docker,dest=dist/stopa-docker.tar .

      - name: Ověřit velikost < 1.5 GB (AK)
        run: |
          SIZE_MB=$(( $(stat -c%s dist/stopa-docker.tar) / 1024 / 1024 ))
          echo "Docker image: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 1536 ]; then
            echo "::error::Docker image přesahuje AK limit 1.5 GB (${SIZE_MB} MB)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stopa-docker-${{ github.ref_name }}
          path: dist/stopa-docker.tar
          if-no-files-found: error
