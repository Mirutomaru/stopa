name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4"

      - name: Ruff check
        run: ruff check src tests

  test:
    name: Tests (pytest + JS DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (dev + web)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Run offline test suite
        # python -m pytest (ne holý pytest) — root na sys.path pro cross-test importy
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JS DOM tests (graph.js přes jsdom)
        working-directory: tests/js
        run: |
          npm ci --no-audit --no-fund
          node graph.test.mjs

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # STP-022 — pip-audit: známé zranitelnosti v závislostech (PyPI Advisory DB)
      - name: Install dependencies + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
          pip install pip-audit

      # Audit nainstalovaného prostředí; editovatelný stopa (git ref) vynechat —
      # pip freeze ho obsahuje jako VCS link a pip-audit by se snažil buildovat.
      - name: Audit dependencies
        run: |
          pip freeze | grep -v "^-e \|^stopa @\|^stopa==" > requirements.txt
          pip-audit --no-deps -r requirements.txt

  # ETAPA D vlna 1 (STP-043): benchmark proti baseline — fail na regresi >20 %
  # a ≥0.5 ms absolutního rozdílu (CI noise guard pro sub-ms položky).
  benchmark:
    name: Benchmark (regrese výkonu)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      # continue-on-error: výsledek se vždy uploadne; fail se vyhodnotí níže.
      - name: Benchmark proti baseline (fail na regresi)
        id: bench
        continue-on-error: true
        run: |
          python scripts/ci_benchmark.py \
            --baseline benchmarks/baseline.json \
            --threshold 0.20 \
            --min-delta-ms 0.5 \
            --output benchmark-result.json

      - name: Upload výsledků (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-result.json
            benchmarks/baseline.json

      # Baseline chybí (první běh bez commitnutého baseline) → warning, ne fail.
      - name: Fail na regresi
        if: steps.bench.outcome == 'failure'
        run: |
          echo "::error::Benchmark detekoval regresii >20 % (a ≥0.5 ms) oproti baseline."
          exit 1
