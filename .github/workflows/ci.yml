name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4"

      - name: Ruff check
        run: ruff check src tests

  test:
    name: Tests (pytest + JS DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (dev + web)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Run offline test suite
        # python -m pytest (ne holý pytest) — root na sys.path pro cross-test importy
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JS DOM tests (graph.js přes jsdom)
        working-directory: tests/js
        run: |
          npm ci --no-audit --no-fund
          node graph.test.mjs

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # STP-022 — pip-audit: známé zranitelnosti v závislostech (PyPI Advisory DB)
      - name: Install dependencies + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
          pip install pip-audit

      # Audit nainstalovaného prostředí; editovatelný stopa (git ref) vynechat —
      # pip freeze ho obsahuje jako VCS link a pip-audit by se snažil buildovat.
      - name: Audit dependencies
        run: |
          pip freeze | grep -v "^-e \|^stopa @\|^stopa==" > requirements.txt
          pip-audit --no-deps -r requirements.txt

  # P4-1 — full profil: všechny volitelné extras + yara-python (funkční cesty „s X“).
  # Min profil je výše (`test`, jen dev+web); skip matice: docs/EXTRAS_COVERAGE.md.
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # weasyprint (extra [pdf]) potřebuje system pango; ostatní extras jsou čisté Python/C wheels.
      # Ubuntu 26.04 runner: libgdk-pixbuf2.0-0 nahradila libgdk-pixbuf-xlib-2.0-0 → fallback níže.
      - name: System deps (weasyprint)
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y --no-install-recommends \
              libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
              libfontconfig1 fonts-dejavu-core; then
            sudo apt-get install -y --no-install-recommends \
              libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-xlib-2.0-0 \
              libfontconfig1 fonts-dejavu-core
          fi

      - name: Install (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,pdf,fde,tsk,stix,rules,xlsx,meta,net,analytics]"

      - name: Test suite (full profile — bez skipů volitelných extras)
        run: python -m pytest -q

  # P4-9 — cross-platform portabilita (analýza §8.8): kurátorovaný subset
  # domain+data testů BEZ Rust wheelu → carving běží na referenční čisté-Python
  # cestě; strict seccomp profil je gateován skipifem (jen linux). Seznam
  # souborů = "portability core" — viz docs/PLATFORM_MATRIX.md. Canary běží i tady:
  # dlouhé běhy musí být stabilní na všech třech platformách.
  windows:
    name: "Windows — portability core (domain+data)"
    runs-on: windows-latest
    # Release 2.4 CI fix: Windows pipe encoding = locale (cp1252) → dětské procesy
    # s českým výstupem padaly UnicodeEncodeError; UTF-8 mode pokrývá i přímé CLI
    # subprocessy testů (kromě sandbox _child_env guardu v plugin_loader).
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # Release 2.4 CI fix: i [web] jako Linux job — portability core obsahuje
        # sandbox testy, které importují volitelné web deps (httpx/fastapi).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Pytest — portability core (domain + data, bez Rust wheelu)
        run: >
          python -m pytest tests/test_p21_work_queue_domain.py
          tests/test_p22_case_registry_domain.py tests/test_p25_threat_intel_domain.py
          tests/test_p26_cross_case_domain.py tests/test_p27_exchange_bundle_domain.py
          tests/test_p27_exchange_domain.py tests/test_p31_search_adv_domain.py
          tests/test_p32_artifact_compare_domain.py tests/test_p33_classification_domain.py
          tests/test_p34_evidence_storage_domain.py tests/test_p35_yara_sigma_domain.py
          tests/test_p02_seal_keys.py tests/test_p03_sandbox_hardening.py
          tests/test_f64_plugins.py tests/test_p42_sandbox_strict.py
          tests/test_p49_leak_canary.py -q --maxfail=50

  # P4-9 — macOS smoke: installovatelnost (editable uv/pip, sqlite3) + stejný
  # portability core. Full suite zůstává na ubuntu (viz PLATFORM_MATRIX.md).
  macos:
    name: "macOS — smoke (install + core)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # Release 2.4 CI fix: i [web] jako Linux job — portability core obsahuje
        # sandbox testy, které importují volitelné web deps (httpx/fastapi).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Pytest — portability core (domain + data, bez Rust wheelu)
        run: >
          python -m pytest tests/test_p21_work_queue_domain.py
          tests/test_p22_case_registry_domain.py tests/test_p25_threat_intel_domain.py
          tests/test_p26_cross_case_domain.py tests/test_p27_exchange_bundle_domain.py
          tests/test_p27_exchange_domain.py tests/test_p31_search_adv_domain.py
          tests/test_p32_artifact_compare_domain.py tests/test_p33_classification_domain.py
          tests/test_p34_evidence_storage_domain.py tests/test_p35_yara_sigma_domain.py
          tests/test_p02_seal_keys.py tests/test_p03_sandbox_hardening.py
          tests/test_f64_plugins.py tests/test_p42_sandbox_strict.py
          tests/test_p49_leak_canary.py -q --maxfail=50

  # P4-10 — Rust wheel parity gate (per push): stopa_core se builduje maturinem
  # v manylinux_2_28 kontejneru (glibc 2.28 = distribuční target), výstupní
  # wheel se nainstaluje do izolovaného venv a F2.1 parity testy ověří bitovou
  # shodu Rust core vs Python referenční cesty na fixním korpusu. aarch64 cross
  # build zde nebývá (jen release) — gate chrání x86_64 cestu, která běží v produkci.
  rust-parity:
    name: "Rust wheel parity (manylinux_2_28)"
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      # rustup v kontejneru (manylinux image nemá Rust toolchain)
      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      # Release 2.4 CI fix: layout manylinux image se liší verzí (cpXXX-x64 → cpXXX-cpXXX /
      # symlinky) → robustní detekce CPython místo hardcoded cesty.
      - name: Detect CPython in manylinux image
        id: py
        run: |
          for cand in /opt/python/cp311* /usr/local/bin/python3.11 /usr/local/bin/python3; do
            for p in $cand/bin/python $cand; do
              if [ -x "$p" ]; then echo "py=$p" >> "$GITHUB_OUTPUT"; exit 0; fi
            done
          done
          echo "::error::CPython nenalezen v manylinux image (/opt/python, /usr/local/bin)" >&2
          exit 1

      # manylinux image má python v /opt/python — izolovaný venv pro gate,
      # aby parity testy běžely PŘES wheel z tohoto buildu (ne systémový core).
      - name: Build wheel + install do izolovaného venv
        run: |
          PY=${{ steps.py.outputs.py }}
          $PY -m venv /venv-p410
          /venv-p410/bin/pip install --upgrade pip
          /venv-p410/bin/pip install maturin pytest
          cd rust
          # --compatibility manylinux_2_28 = auto auditwheel repair na distribuční tag
          /venv-p410/bin/maturin build --release \
            --compatibility manylinux_2_28 -o ../dist-rust/
          cd ..
          /venv-p410/bin/pip install dist-rust/*.whl
          # stopa bez extras (core) — parity testy potřebují jen stdlib + stopa core
          /venv-p410/bin/pip install -e . --no-deps

      # F2.1 parity: Rust vs Python referenční cesta (hashing + carving), bitová shoda
      - name: Parity testy (F2.1, wheel z tohoto buildu)
        run: env -u STOPA_DB_DIR /venv-p410/bin/python -m pytest tests/test_f21_rust_core.py -q

  # ETAPA D vlna 1 (STP-043): benchmark proti baseline — fail na regresi >20 %
  # a ≥0.5 ms absolutního rozdílu (CI noise guard pro sub-ms položky).
  benchmark:
    name: Benchmark (regrese výkonu)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      # continue-on-error: výsledek se vždy uploadne; fail se vyhodnotí níže.
      - name: Benchmark proti baseline (fail na regresi)
        id: bench
        continue-on-error: true
        run: |
          python scripts/ci_benchmark.py \
            --baseline benchmarks/baseline.json \
            --threshold 0.20 \
            --min-delta-ms 0.5 \
            --output benchmark-result.json

      - name: Upload výsledků (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-result.json
            benchmarks/baseline.json

      # Baseline chybí (první běh bez commitnutého baseline) → warning, ne fail.
      - name: Fail na regresi
        if: steps.bench.outcome == 'failure'
        run: |
          echo "::error::Benchmark detekoval regresii >20 % (a ≥0.5 ms) oproti baseline."
          exit 1
