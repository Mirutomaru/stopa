[package]
name = "stopa-core"
version = "0.1.0"
edition = "2021"
description = "STOPA Rust core — high-performance hashing + carving scan (F2.1)"
license = "MIT"

[lib]
name = "stopa_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
aho-corasick = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
