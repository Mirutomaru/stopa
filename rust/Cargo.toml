[package]
name = "stopa-core"
version = "0.1.0"
edition = "2021"
description = "STOPA Rust core — high-performance hashing + carving scan (F2.1)"
license = "MIT"

[lib]
name = "stopa_core"
crate-type = ["cdylib"]

[dependencies]
# P4-10 — abi3-py310: jeden wheel per platforma pro všechny Python >= 3.10
# (STOPA requires-python = ">=3.10"); bez abi3 by matrix nutně obsahoval i Py verze.
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
sha1 = "0.10"
# asm: SSE/AVX shapy — čistý Rust sha2 dělá ~1 GB/s, se asm > 3 GB/s (F2.3 AK overhead)
sha2 = { version = "0.10", features = ["asm"] }
md5 = "0.7"
aho-corasick = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
